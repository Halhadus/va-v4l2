name: Build and test
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  unit:
    name: Unit (${{ matrix.mode }})
    runs-on: ${{ matrix.runner }}
    env:
      CC: ${{ matrix.compiler }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - {mode: normal, compiler: gcc, runner: ubuntu-24.04}
          - {mode: sanitizers, compiler: gcc, runner: ubuntu-24.04}
          - {mode: clang, compiler: clang, runner: ubuntu-24.04}
          - {mode: aarch64, compiler: gcc, runner: ubuntu-24.04-arm}
          - {mode: libva-2.24.1, compiler: gcc, runner: ubuntu-24.04, libva: 2.24.1}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential meson ninja-build pkg-config libdrm-dev libgbm-dev libegl-dev libgles-dev ffmpeg ${{ matrix.compiler == 'clang' && 'clang libclang-rt-dev' || '' }}
      - name: libva ${{ matrix.libva || '2.23.0' }}
        run: |
          git clone --depth 1 --branch ${{ matrix.libva || '2.23.0' }} https://github.com/intel/libva.git "$RUNNER_TEMP/libva"
          meson setup "$RUNNER_TEMP/libva-build" "$RUNNER_TEMP/libva" --prefix="$RUNNER_TEMP/va" --libdir=lib -Dwith_x11=no -Dwith_glx=no -Dwith_wayland=no -Dwith_win32=no
          meson compile -C "$RUNNER_TEMP/libva-build"
          meson install -C "$RUNNER_TEMP/libva-build"
          echo "PKG_CONFIG_PATH=$RUNNER_TEMP/va/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$RUNNER_TEMP/va/lib" >> "$GITHUB_ENV"
      - name: Tests
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          meson setup build -Dwerror=true -Db_lto=${{ matrix.compiler == 'gcc' && matrix.mode != 'sanitizers' }} -Dfuzzing=${{ matrix.compiler == 'clang' }}
          python3 tools/test.py --suite unit ${{ matrix.mode == 'sanitizers' && '--sanitize' || '' }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-report-${{ matrix.mode }}
          path: verify/libva-v4l2-run-*.tar.gz
          if-no-files-found: error
          retention-days: 30
  musl:
    name: Unit (musl, BusyBox)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Alpine build and tests
        run: |
          docker run --rm -v "$PWD:/src" -w /src alpine:3.23 sh -ec '
            apk add --no-cache build-base meson ninja python3 pkgconf linux-headers libdrm-dev mesa-dev bash git ffmpeg
            git clone --depth 1 --branch 2.23.0 https://github.com/intel/libva.git /tmp/libva
            meson setup /tmp/libva-build /tmp/libva --prefix=/usr --libdir=lib -Dwith_x11=no -Dwith_glx=no -Dwith_wayland=no -Dwith_win32=no
            meson compile -C /tmp/libva-build -j 2
            meson install -C /tmp/libva-build
            meson setup build-musl -Dwerror=true -Db_lto=true
            meson compile -C build-musl -j 2
            python3 tools/test.py --suite unit --build-dir build-musl
          '
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-report-musl
          path: verify/libva-v4l2-run-*.tar.gz
          if-no-files-found: error
          retention-days: 30
  binary:
    name: Debian binary package
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build, install, reinstall, remove and purge
        run: |
          docker run --rm -v "$PWD:/src" -w /src debian:sid sh -ec '
            export DEBIAN_FRONTEND=noninteractive DEB_BUILD_OPTIONS=parallel=2
            apt-get update
            apt-get install -y build-essential debhelper meson ninja-build pkg-config libva-dev libdrm-dev libgbm-dev libegl-dev libgles-dev linux-libc-dev python3 git ffmpeg
            dpkg-buildpackage -us -uc -b
            set -- ../libva-v4l2_*.deb
            test "$#" -eq 1
            package=$1
            test -f "$package"
            dpkg-deb -f "$package" Depends
            apt-get install -y "$package"
            driver=/usr/lib/$(dpkg-architecture -qDEB_HOST_MULTIARCH)/dri/v4l2_drv_video.so
            test -f "$driver"
            nm -D --defined-only "$driver"
            dpkg -i "$package"
            dpkg --remove libva-v4l2
            test ! -e "$driver"
            dpkg --purge libva-v4l2
          '
  source:
    name: Source package
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Commit whitespace
        run: git show --format= --check HEAD
      - name: Debian source package
        run: |
          package=$(dpkg-parsechangelog -S Source)
          version=$(dpkg-parsechangelog -S Version)
          stage="$RUNNER_TEMP/$package-$version"
          mkdir "$stage"
          git archive HEAD | tar -x -C "$stage"
          cd "$RUNNER_TEMP"
          dpkg-source --build "$stage"
      - uses: actions/upload-artifact@v7
        with:
          name: source-package
          path: |
            ${{ runner.temp }}/libva-v4l2_*.dsc
            ${{ runner.temp }}/libva-v4l2_*.tar.xz
          if-no-files-found: error
          retention-days: 30
